- name: Install dependencies for Docker
  shell: apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
    # name: 
    #   - ca-certificates
    #   - curl
    #   - gnupg
    # state: present

- name: Create Docker Keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.asc
    mode: "0644"

- name: Convert Docker GPG key 
  shell: gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc

- name: Add Docker repository
  shell: echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

- name: Update apt cache
  shell: apt-get update
    # repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
    # filename: docker 
    # state: present
    # update_cache: yes

- name: Install Docker and Docker Compose
  shell: apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    # name: 
    #   - docker-ce
    #   - docker-ce-cli
    #   - containerd.io
    #   - docker-buildx-plugin
    #   - docker-compose-plugin
    # state: present

- name: Service Docker start and enable
  service:
    name: docker
    state: started
    enabled: true

- name: Create user to docker group 
  user:
    name: nurzhanbek
    groups: docker
    append: true
