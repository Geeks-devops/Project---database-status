services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5     

  app: 
    build: .
    container_name: db-status-app
    restart: always
    ports:
      - "80:3000"
    env_file:
      - .env
    environment:
      # Пробрасываем хост и настройки под именами, которые обычно использует Node.js/бэкенд:
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      # Также продублируем переменные POSTGRES_*:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data: {}
