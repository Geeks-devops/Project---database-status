services:

  # ──────────────────────────────────────────
  # База данных PostgreSQL
  # ──────────────────────────────────────────
  postgresql:
    container_name: postgresql
    image: postgres:18-bookworm        # официальный образ из Docker Hub
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/   # данные хранятся между перезапусками
    expose:
      - "5432"                    # пробрасываем порт для локальных инструментов

  # ──────────────────────────────────────────
  # Node.js бэкенд + встроенный фронтенд
  # ──────────────────────────────────────────

  app:
    container_name: app
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env 
    ports:
      - "80:3000"                    # приложение доступно на http://localhost:3000
    depends_on: 
      - postgresql
volumes:
  postgres_data:

