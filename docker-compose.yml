services:

  # ──────────────────────────────────────────
  # База данных PostgreSQL
  # ──────────────────────────────────────────
  postgresql:
    container_name: postgresql
    image: postgres:16-alpine   # официальный образ из Docker Hub
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data   # данные хранятся между перезапусками
    expose:
      - "5432" 
    healthcheck:
      test: pg_isready -U appuser -d appdb
  # ──────────────────────────────────────────
  # Node.js бэкенд + встроенный фронтенд
  # ──────────────────────────────────────────

  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    env_file: .env 
    ports:
      - "80:3000"
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:   # том для хранения данных PostgreSQL
