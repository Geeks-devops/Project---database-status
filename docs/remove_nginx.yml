---
- name: Remove Nginx web server
  hosts: all
  become: true
  tasks:
    - name: Stop and disable Nginx service
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Purge Nginx packages and configuration files
      ansible.builtin.apt:
        name:
          - nginx
          - nginx-common
          - nginx-core
        state: absent
        purge: true
