<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Connection Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #151821;
      --surface2: #1c2030;
      --border: rgba(255,255,255,0.07);
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --blue: #3b82f6;
      --text: #e2e8f0;
      --muted: #64748b;
      --radius: 14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(34,197,94,0.05) 0%, transparent 60%);
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .card.connected::before {
      background: linear-gradient(135deg, rgba(34,197,94,0.06) 0%, transparent 60%);
    }

    .card.disconnected::before {
      background: linear-gradient(135deg, rgba(239,68,68,0.06) 0%, transparent 60%);
    }

    /* Status badge */
    .status-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .status-dot-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      position: relative;
      z-index: 1;
      transition: background 0.5s;
    }

    .status-dot.ok  { background: rgba(34,197,94,0.15); }
    .status-dot.err { background: rgba(239,68,68,0.15); }
    .status-dot.wait{ background: rgba(234,179,8,0.15); }

    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      animation: pulse-ring 2s ease-out infinite;
      opacity: 0;
    }

    .status-dot.ok   + .pulse-ring { border: 2px solid var(--green); }
    .status-dot.err  + .pulse-ring { border: 2px solid var(--red); }

    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .status-text h2 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .status-text h2.ok   { color: var(--green); }
    .status-text h2.err  { color: var(--red); }
    .status-text h2.wait { color: var(--yellow); }

    .status-text p {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 3px;
    }

    /* Info grid */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .info-item .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .info-item .value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text);
      word-break: break-all;
    }

    .info-item .value.latency-ok  { color: var(--green); }
    .info-item .value.latency-mid { color: var(--yellow); }
    .info-item .value.latency-bad { color: var(--red); }

    /* Error block */
    .error-block {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #fca5a5;
      display: none;
    }

    /* DB version */
    .version-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      display: none;
    }

    /* History log */
    .log-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      width: 100%;
      max-width: 560px;
    }

    .log-card h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .log-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .log-dot.ok  { background: var(--green); }
    .log-dot.err { background: var(--red); }

    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-msg  { color: var(--text); }
    .log-ms   { margin-left: auto; color: var(--muted); }

    /* Refresh indicator */
    .refresh-bar {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }

    .refresh-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--green));
      border-radius: 2px;
      animation: refill 5s linear infinite;
    }

    @keyframes refill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* Footer */
    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🗄 DB Connection Monitor</h1>
    <p>Real-time backend → database connectivity status</p>
  </header>

  <!-- Main status card -->
  <div class="card" id="statusCard">
    <div class="status-row">
      <div class="status-dot-wrapper">
        <div class="status-dot wait" id="statusDot">⏳</div>
        <div class="pulse-ring" id="pulseRing"></div>
      </div>
      <div class="status-text">
        <h2 class="wait" id="statusTitle">Connecting…</h2>
        <p id="statusSub">Waiting for first response</p>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="label">Host</div>
        <div class="value" id="infoHost">—</div>
      </div>
      <div class="info-item">
        <div class="label">Port</div>
        <div class="value" id="infoPort">—</div>
      </div>
      <div class="info-item">
        <div class="label">Database</div>
        <div class="value" id="infoDb">—</div>
      </div>
      <div class="info-item">
        <div class="label">User</div>
        <div class="value" id="infoUser">—</div>
      </div>
      <div class="info-item">
        <div class="label">Latency</div>
        <div class="value" id="infoLatency">—</div>
      </div>
      <div class="info-item">
        <div class="label">Last check</div>
        <div class="value" id="infoTime">—</div>
      </div>
    </div>

    <div class="version-block" id="versionBlock"></div>
    <div class="error-block"   id="errorBlock"></div>
    <div class="refresh-bar"><div class="refresh-bar-fill" id="refreshBar"></div></div>
  </div>

  <!-- History log -->
  <div class="log-card">
    <h3>Event Log</h3>
    <ul class="log-list" id="logList"></ul>
  </div>

  <footer>Polling every 5 seconds via SSE &nbsp;·&nbsp; Backend: <span id="backendUrl">http://localhost:3001</span></footer>

  <script>
    const BACKEND = ''; // фронт и бэк на одном сервере
    document.getElementById('backendUrl').textContent = window.location.origin;

    const statusCard   = document.getElementById('statusCard');
    const statusDot    = document.getElementById('statusDot');
    const statusTitle  = document.getElementById('statusTitle');
    const statusSub    = document.getElementById('statusSub');
    const infoHost     = document.getElementById('infoHost');
    const infoPort     = document.getElementById('infoPort');
    const infoDb       = document.getElementById('infoDb');
    const infoUser     = document.getElementById('infoUser');
    const infoLatency  = document.getElementById('infoLatency');
    const infoTime     = document.getElementById('infoTime');
    const versionBlock = document.getElementById('versionBlock');
    const errorBlock   = document.getElementById('errorBlock');
    const logList      = document.getElementById('logList');

    function timeNow() {
      return new Date().toLocaleTimeString('ru-RU', { hour12: false });
    }

    function latencyClass(ms) {
      if (ms < 50)  return 'latency-ok';
      if (ms < 200) return 'latency-mid';
      return 'latency-bad';
    }

    function addLog(ok, msg, ms) {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="log-dot ${ok ? 'ok' : 'err'}"></span>
        <span class="log-time">${timeNow()}</span>
        <span class="log-msg">${msg}</span>
        ${ms !== undefined ? `<span class="log-ms">${ms}ms</span>` : ''}
      `;
      logList.prepend(li);
      // keep max 30 entries
      while (logList.children.length > 30) logList.lastChild.remove();
    }

    function applyStatus(data) {
      const ok = data.connected;

      // card glow class
      statusCard.className = 'card ' + (ok ? 'connected' : 'disconnected');

      // dot
      statusDot.className = 'status-dot ' + (ok ? 'ok' : 'err');
      statusDot.textContent = ok ? '✓' : '✗';

      // title
      statusTitle.className = ok ? 'ok' : 'err';
      statusTitle.textContent = ok ? 'Connected' : 'Disconnected';
      statusSub.textContent = ok
        ? `Successfully connected to PostgreSQL`
        : `Cannot reach the database`;

      // info
      infoHost.textContent    = data.host    || '—';
      infoPort.textContent    = data.port    || '—';
      infoDb.textContent      = data.database|| '—';
      infoUser.textContent    = data.user    || '—';
      infoTime.textContent    = timeNow();

      const ms = data.latency_ms;
      infoLatency.textContent = ms !== undefined ? `${ms} ms` : '—';
      infoLatency.className   = 'value ' + (ms !== undefined ? latencyClass(ms) : '');

      // version
      if (ok && data.db_version) {
        versionBlock.textContent = data.db_version;
        versionBlock.style.display = 'block';
      } else {
        versionBlock.style.display = 'none';
      }

      // error
      if (!ok && data.error) {
        errorBlock.textContent = '⚠ ' + data.error;
        errorBlock.style.display = 'block';
      } else {
        errorBlock.style.display = 'none';
      }

      // log
      addLog(ok, ok ? 'DB connection OK' : 'DB connection FAILED', ms);
    }

    function connectSSE() {
      const es = new EventSource(`${BACKEND}/api/db-status/stream`);

      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          applyStatus(data);
        } catch (_) {}
      };

      es.onerror = () => {
        statusCard.className = 'card disconnected';
        statusDot.className = 'status-dot err';
        statusDot.textContent = '✗';
        statusTitle.className = 'err';
        statusTitle.textContent = 'Backend Unreachable';
        statusSub.textContent = 'Cannot connect to backend server';
        errorBlock.textContent = `⚠ Cannot reach backend at ${BACKEND}`;
        errorBlock.style.display = 'block';
        versionBlock.style.display = 'none';
        addLog(false, 'Backend SSE connection lost');
        es.close();
        // retry in 5s
        setTimeout(connectSSE, 5000);
      };
    }

    connectSSE();
  </script>
</body>
</html>
